# vedio-22
# 1. ServiceAccount - "Ye kaun hai?"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-user
  namespace: default
# 2. Role — Permissions -  "Isko kya permission hai?"

This gives dev-user permission to get, list, and watch Pods.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: default

rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
# 3. RoleBinding — Connect User to Role - "Ye permission kis user ko deni hai?"
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: default

subjects:
  - kind: ServiceAccount
    name: dev-user
    namespace: default

roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

# Verb	         Meaning
get-	Ek Pod ki information dekh sakta hai
list-	Pods ki list dekh sakta hai
watch-	Pods mein changes dekh sakta hai

