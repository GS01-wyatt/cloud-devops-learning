Q. Why use an Init Container?
An Init Container performs setup tasks before the main application starts, such as:
Waiting for a Service or Database
Downloading configuration files
Setting permissions
Initializing data


apiVersion: v1
kind: pod
metadata:
  name: myapp
  labels:
    name: myapp-pod

  spec:
   containers:
  - name: mtapp-container
    image: myapp-container
    command: ['sh', '-c', 'echo the app is running && sleep 3600']
    env:
    - name: FIRSTNAME
      value:"Golu"
  initContainers:
  - name: initmyservice
    image: busybox:1.28
    command: ['sh', '-c']
    args: ['until nslookup myservice.default.svc.cluster.local; do echo waiting for service to be up;sleep 2; done']

